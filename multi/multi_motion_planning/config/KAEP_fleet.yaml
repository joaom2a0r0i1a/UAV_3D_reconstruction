frame_id: "world_origin"

body:
  frame_id: "fcu"

timer_main:
  rate: 10.0 # [Hz]

environment: school

uav_parameters:
  max_vel: 1.0           # [m/s]
  max_accel: 1.0         # [m/s^2]
  max_heading_vel: 2.0   # [rad/s]
  max_heading_accel: 2.0 # [rad/s^2]

local_planning:
  N_max: 50
  N_termination: 300
  N_yaw_samples: 10
  radius: 4.0    # [m]
  step_size: 2.0 # [m]
  tolerance: 1.5 # [m]
  g_zero: 5.0

global_planning:
  N_min_nodes: 150
  global_max_acceleration_iterations: 2

camera:
  frame_id: "rgbd_front_pitched/aligned_depth_to_color"
  h_fov: 1.51844    # [rad]
  width: 1080
  height: 720
  min_distance: 0.2 # [m]
  max_distance: 5   # [m]

path:
  uav_radius: 1.5                # [m]
  recovery_enabled: true         # in-planner backtrack on | off
  recovery_boxed_deadline: 4.0   # [s]
  recovery_min_tree: 10          # tree size still counted as boxed in
  recovery_timeout: 12.0         # [s]
  lambda: 0.25                   # (tuning factor)
  lambda2: 0.5                   # (tuning factor)
  global_lambda: 0.025           # (tuning factor)
  global_lambda2: 0.05           # (tuning factor)
  max_acceleration_iterations: 3

