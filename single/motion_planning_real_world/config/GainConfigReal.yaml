# Real-world gain-evaluation config (replaces the sim GainConfig.yaml in the real launches, so
# real flights stop silently inheriting the sim's active environment box).
# NOTE: this box is RELATIVE TO THE TAKEOFF POSE — the planner shifts it by the captured start offset via GainEvaluator::setWorldOffset.

