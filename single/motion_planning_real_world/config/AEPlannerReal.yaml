local_planning:
  N_max: 200
  N_termination: 400
  N_yaw_samples: 10
  radius: 2.0 # [m]
  step_size: 2.0 # [m] bigger scenarios need longer legs; also cuts stop-start cycles
  min_edge_length: 0.2 # [m]
  tolerance: 0.5 # [m]
  g_zero: 1.0

global_planning:
  N_min_nodes: 400
  selection: "score"       # goal pick: "cost" (nearest), "gain" (most info), "score" (gain discounted by distance)

evaluation:
  marginal_gain: true      # true: marginal (frontier = path sum in global), false: absolute; launch arg wins
  objective: expdecay      # expdecay | rate_L
  compute: "gpu"           # "gpu" (batched; absolute batches the whole tree) or "cpu" (sequential; marginal=hash)
  marginal_split: false    # for marginal+gpu: false = fused kernel, true = split kernel

camera:
  frame_id: "camera_link"
  h_fov: 1.38203 # [rad] measured, D455 colour at 640x480
  width: 640
  height: 480
  min_distance: 0.3 # [m]
  max_distance: 5 # [m]
  pitch: 10.0 # [deg] downward camera pitch (matches the physical mount)

path:
  uav_radius: 1.5 # [m] must stay well under the voxblox ESDF clamp (esdf_max_distance_m, default 2.0): free space saturates at 2.0, so a radius at/near it makes every edge read as a collision
  waypoint_reach_distance: 0.4 # [m] reached within this dist (+ yaw diff < 0.4 rad)
  waypoint_reach_velocity: 0.15 # [m/s] velocity gate: chain-final waypoint also needs speed below this (true stop-and-go)
  collision_check_resolution: 0.1 # [m] edge/node sampling spacing (= voxel size so thin walls are not stepped over)
  optimistic_iterations: 5 # edges may plan through UNKNOWN only for the first N replans (bootstrap); then unknown=blocked
  recovery_enabled: true # master toggle for the in-planner backtrack
  recovery_boxed_deadline: 4.0 # [s] if the tree is still tiny after this while planning -> backtrack (boxed in)
  recovery_min_tree: 10 # tree node count below which it counts as "still empty" for the boxed-in check
  recovery_timeout: 12.0 # [s] hard deadline: AEP() backtracks after this no matter what
  lambda: 0.5 # (tunning factor)
  global_lambda: 0.05 # (tunning factor)

rotation:
  step_deg: 45.0 # [deg] recovery sweep step (8 steps); keep well under 180
  settle: 1.0 # [s] wait per step; 45deg at ATC_SLEW_YAW 60deg/s needs 0.75

exploration:
  initial: true # up, rotate, down once before the first plan; a yaw sweep alone keeps the same optical centre so it cannot carve near-field artifacts
  climb: 1.5 # [m] relative climb
  settle: 5.0 # [s] per vertical leg; 1.5 m at WPNAV_SPEED_UP 70 cm/s is ~2.1 s
  return_to_start: true
