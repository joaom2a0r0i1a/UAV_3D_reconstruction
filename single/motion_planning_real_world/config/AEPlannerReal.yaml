# Short Grove (active) (three trees, 22 m) - z ceiling carries a +1 m slope allowance, see Delta-h note
bounded_box:
  min_x: -25.0 # [m]  gain -22 + 3 m (2x uav_radius) of manoeuvring margin
  max_x: 3.0 # [m]
  min_y: -5.5 # [m]  centre-of-mass limit; body reaches -7.0, open ground beyond
  max_y: 5.5 # [m]
  min_z: 3.0 # [m]
  max_z: 11.0 # [m]

