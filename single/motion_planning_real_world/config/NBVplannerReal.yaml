frame_id: "map"

body:
  frame_id: "base_link"

timer_main:
  rate: 10.0 # [Hz]

# NOTE: bounded_box is RELATIVE TO THE TAKEOFF POSE — the planner captures the start offset on ~start (re-capturable via ~offset) and shifts this box + the gain box by it.

# Basketball (active)
bounded_box:
  min_x: -6.0 # [m]
  max_x: 6.0 # [m]
  min_y: -6.0 # [m]
  max_y: 6.0 # [m]
  min_z: 2.0 # [m]
  max_z: 8.0 # [m]

# School sim-test (ABSOLUTE school box pre-compensated for spawn -22,0; used with session_realtest.yml)
