uav_parameters:
  max_vel: 0.5           # [m/s]
  max_accel: 1.0         # [m/s^2]
  max_heading_vel: 2.0   # [rad/s]
  max_heading_accel: 2.0 # [rad/s^2]

local_planning:
  N_max: 200
  N_termination: 400
  N_yaw_samples: 10
  radius: 2.0    # [m]
  step_size: 1.5 # [m]
  tolerance: 0.5 # [m]
  g_zero: 1.0

global_planning:
  N_min_nodes: 400
  global_max_acceleration_iterations: 2

camera:
  frame_id: "camera_link"
  h_fov: 1.38203    # [rad]
  width: 640
  height: 480
  min_distance: 0.3 # [m]
  max_distance: 5   # [m]

path:
  uav_radius: 1.5              # [m]
  lambda: 0.25                 # (tuning factor)
  lambda2: 0.5                 # (tuning factor)
  global_lambda: 0.025         # (tuning factor)
  global_lambda2: 0.05         # (tuning factor)
  max_acceleration_iterations: 3
  recovery_enabled: true       # in-planner backtrack on | off
  recovery_boxed_deadline: 4.0 # [s]
  recovery_min_tree: 10        # tree size still counted as boxed in
  recovery_timeout: 12.0       # [s]


rotation:
  step_deg: 45.0 # [deg] keep well under 180
  settle: 1.0    # [s] wait per step

exploration:
  initial: true         # up, rotate, down before the first plan
  climb: 1.5            # [m] relative climb
  settle: 4.0           # [s] after the climb and the return
  return_to_start: true # back to the start pose after the sweep
