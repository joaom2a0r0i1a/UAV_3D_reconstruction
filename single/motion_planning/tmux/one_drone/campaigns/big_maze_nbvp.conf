# BIG MAZE RH-NBVP yaw-opt: absolute vs marginal, 5v5. voxel 0.1 m.
# optimize_yaw=true (RH-NBVP); N_max=250, N_term=1000, step 1.5 -- IDENTICAL node+step to the big_maze
# AEP campaign (world_aep_params big_maze = 250 1000 1000 2.0 1.5 1.0) so AEP and RH-NBVP are compared
# on equal footing. (N_term 1000 > N_max 250 so the receding horizon still recedes.) Same big_maze env
# as the AEP campaign (box/gain region/uav_radius set by set_world). Both conditions differ ONLY in gain.
WORLD=big_maze
PLANNER=nbvp
N=5
VOXEL_SIZE=0.1
EARLY_STOP=true
GRACE=70.0
KEEP_FOLDER=multi_series_big_maze_nbvp
SUMMARY=DECISION_SUMMARY_BIG_MAZE_NBVP.txt
# NBVP: "label|gain|nmax|nterm|step|fixed|optyaw"   gain=abs|marg
CONDITIONS=(
  "BIG_MAZE_NBV_abs|abs|250|1000|1.5|false|true"
  "BIG_MAZE_NBV_marg|marg|250|1000|1.5|false|true"
)
