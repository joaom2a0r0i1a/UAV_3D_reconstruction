# SCHOOL — RH-NBVP (yaw-opt) FIXED-STEP, node-set 1000/1500, absolute vs marginal, 10v10. voxel 0.2 m (school baseline).
# Node-set sweep companion to school_NBVP_fixedstep/500_1000 + the 50/300 point (all step 2.0, yaw-opt, voxel 0.2).
# fixed_step=true forces EVERY edge == step_size (2.0). GT-mode eval (school mesh). Only marginal_gain differs.
WORLD=school
PLANNER=nbvp
N=10
VOXEL_SIZE=0.2
T=1850
EARLY_STOP=true
GRACE=60.0
KEEP_FOLDER=multi_series_school_nbvp_fs_1000_1500
SUMMARY=DECISION_SUMMARY_SCHOOL_NBVP_FS_1000_1500.txt
# NBVP: "label|gain|nmax|nterm|step|fixed|optyaw"   gain=abs|marg
CONDITIONS=(
  "NBV_abs_yaw_n1000_fs|abs|1000|1500|2.0|true|true"
  "NBV_marg_yaw_n1000_fs|marg|1000|1500|2.0|true|true"
)
