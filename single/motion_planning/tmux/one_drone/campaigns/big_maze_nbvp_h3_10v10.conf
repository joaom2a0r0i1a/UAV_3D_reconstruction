# NBVP: "label|gain|nmax|nterm|step|fixed|optyaw|objective|horizon"
CONDITIONS=(
  "BIG_MAZE_NBV_H3_marg|marg|250|1000|1.5|false|true|expdecay|3"
  "BIG_MAZE_NBV_H3_abs|abs|250|1000|1.5|false|true|expdecay|3"
)
