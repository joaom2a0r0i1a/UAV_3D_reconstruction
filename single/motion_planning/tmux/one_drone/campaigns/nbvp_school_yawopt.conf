# SCHOOL RH-NBVP yaw-opt: absolute vs marginal, N_max=1000, N_term=1500, step 1.0.
# Replaces nbvp_school_yawopt_2way.sh. optimize_yaw=true; N_term MUST be > N_max
# or the receding horizon never recedes.
WORLD=school
PLANNER=nbvp
N=10
T=1850
EARLY_STOP=true
GRACE=60.0
KEEP_FOLDER=multi_series_nbvp_school_yawopt
SUMMARY=DECISION_SUMMARY_NBVP_SCHOOL_YAWOPT.txt
# NBVP: "label|gain|nmax|nterm|step|fixed|optyaw"   gain=abs|marg
CONDITIONS=(
  "NBV_abs_yaw|abs|1000|1500|1.0|false|true"
  "NBV_marg_yaw|marg|1000|1500|1.0|false|true"
)
