# POLICE marginal-variant screening: R2A / R1A / R2B at N=5 (config-only flag flips).
# Replaces police_variants_campaign.sh. The 2x2 is R1/R2 (edge_follow_yaw) x A/B
# (score_pathsum); these are global-planner-only. Screen to beat absolute AEP.
WORLD=police
PLANNER=aep
N=5
T=950
EARLY_STOP=true
GRACE=60.0
KEEP_FOLDER=multi_series_police_variants
SUMMARY=DECISION_SUMMARY_POLICE_VARIANTS.txt
CONDITIONS=(
  "POL_marg_R2A|marg|R2A"
  "POL_marg_R1A|marg|R1A"
  "POL_marg_R2B|marg|R2B"
)
