# BIG MAZE RH-NBVP yaw-opt: gain OBJECTIVE study (X3d) — G/L (info-rate) under absolute vs marginal, 10v10.
# voxel 0.1 m. Same env/params as big_maze_nbvp.conf (N_max=250, N_term=1000, step 1.5, optimize_yaw) so it
# is directly comparable; ONLY the objective changes to rate_L (score = G_cum / max(L,0.1)). The exp-decay
# baselines (both gains) already exist as the big_maze_nbvp campaign, giving the full 2x2 objective x gain grid.
# Thesis (X3d): the ratio objective G/L is viable under path-consistent G_all but inflates redundant long
# branches under G_abs. 8th CONDITIONS field = objective (expdecay|rate_L).
WORLD=big_maze
PLANNER=nbvp
N=10
VOXEL_SIZE=0.1
EARLY_STOP=true
GRACE=70.0
KEEP_FOLDER=multi_series_big_maze_nbvp_GL
SUMMARY=DECISION_SUMMARY_BIG_MAZE_NBVP_GL.txt
# NBVP: "label|gain|nmax|nterm|step|fixed|optyaw|objective"   gain=abs|marg
CONDITIONS=(
  "BIG_MAZE_NBV_GL_abs|abs|250|1000|1.5|false|true|rate_L"
  "BIG_MAZE_NBV_GL_marg|marg|250|1000|1.5|false|true|rate_L"
)
