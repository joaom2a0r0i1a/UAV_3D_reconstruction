# SCHOOL RH-NBVP yaw-opt: gain OBJECTIVE study (X3d) — G/L (info-rate) under absolute vs marginal, 10v10.
# School is the OPEN env (big_maze corridors were a bad GL env: low overlap → wash). voxel 0.2 m (school
# baseline). N_max=250, N_term=500 (the 250/500 node-set the GL work reverted to), step 2.0, optimize_yaw.
# Only the objective changes to rate_L (score = G_cum / max(L,0.1)); the exp-decay baselines already exist
# as nbvp_school_* campaigns for cross-reference. 8th CONDITIONS field = objective (expdecay|rate_L).
WORLD=school
PLANNER=nbvp
N=10
T=1850
EARLY_STOP=true
GRACE=60.0
KEEP_FOLDER=multi_series_nbvp_school_GL
SUMMARY=DECISION_SUMMARY_NBVP_SCHOOL_GL.txt
# NBVP: "label|gain|nmax|nterm|step|fixed|optyaw|objective"   gain=abs|marg
CONDITIONS=(
  "SCH_NBV_GL_abs|abs|250|500|2.0|false|true|rate_L"
  "SCH_NBV_GL_marg|marg|250|500|2.0|false|true|rate_L"
)
