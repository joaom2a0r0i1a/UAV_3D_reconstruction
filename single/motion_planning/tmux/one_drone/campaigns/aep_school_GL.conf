# SCHOOL AEP: gain OBJECTIVE study (X3d) — G/L (info-rate, rate_L) under absolute vs marginal, 10v10.
# School is the OPEN env, voxel 0.2 m (school baseline). Objective = rate_L (score = G_cum / max(L,0.1)).
# Node-set 250/500/500 (local N_max / local N_term = global N_min_nodes) to line up with nbvp_school_GL.
WORLD=school
PLANNER=aep
N=10
T=1850
EARLY_STOP=true
GRACE=60.0
KEEP_FOLDER=multi_series_aep_school_GL
SUMMARY=DECISION_SUMMARY_AEP_SCHOOL_GL.txt
# AEP: "label|gain|_|rrt_star|objective|N_max|N_termination|N_min_nodes"  (node-set optional; empty=world default)
CONDITIONS=(
  "SCH_AEP_GL_abs|abs|_|false|rate_L|250|500|500"
  "SCH_AEP_GL_marg|marg|_|false|rate_L|250|500|500"
)
