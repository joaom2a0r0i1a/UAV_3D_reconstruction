# SCHOOL — RH-NBVP (yaw-opt) FIXED-STEP, node-set 500/1000, absolute vs marginal, 10v10. voxel 0.2 m (school baseline).
# Node-set sweep companion to school_NBVP_fixedstep/250_500 + the 50/300 point (all step 2.0, yaw-opt, voxel 0.2).
# fixed_step=true forces EVERY edge == step_size (2.0). GT-mode eval (school mesh). Only marginal_gain differs.
WORLD=school
PLANNER=nbvp
N=10
VOXEL_SIZE=0.2
T=1850
EARLY_STOP=true
GRACE=60.0
KEEP_FOLDER=multi_series_school_nbvp_fs_500_1000
SUMMARY=DECISION_SUMMARY_SCHOOL_NBVP_FS_500_1000.txt
# NBVP: "label|gain|nmax|nterm|step|fixed|optyaw"   gain=abs|marg
CONDITIONS=(
  "NBV_abs_yaw_n500_fs|abs|500|1000|2.0|true|true"
  "NBV_marg_yaw_n500_fs|marg|500|1000|2.0|true|true"
)
