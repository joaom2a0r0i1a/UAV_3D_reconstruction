# WAREHOUSE — RH-NBVP (yaw-opt) absolute vs marginal, 10v10. voxel 0.1 m.
# Params IDENTICAL to warehouse AEP: N_max=250, N_termination=1000, step 1.0, optimize_yaw=ON, fixed_step=OFF.
# (N_term 1000 > N_max 250 so the receding horizon still recedes.) Only marginal_gain differs.
WORLD=warehouse
PLANNER=nbvp
N=10
VOXEL_SIZE=0.1
EARLY_STOP=true
GRACE=70.0
KEEP_FOLDER=multi_series_warehouse_nbvp
SUMMARY=DECISION_SUMMARY_WAREHOUSE_NBVP.txt
# NBVP: "label|gain|nmax|nterm|step|fixed|optyaw" — matched to warehouse AEP / big_maze: 250/1000 step 1.5
CONDITIONS=(
  "WH_NBV_abs|abs|250|1000|1.5|false|true"
  "WH_NBV_marg|marg|250|1000|1.5|false|true"
)
