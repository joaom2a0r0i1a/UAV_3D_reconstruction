# BIG MAZE — AEP absolute vs marginal, N=3 each (3v3). voxel 0.1m, step 1.5, g_zero 2.0, time_limit 45min.
# Symmetric world x[-20,20] y[-20,20] z[0,2.5] (spawns at origin). Volume-mode eval (no GT ply yet).
# uav_radius 0.8 (corridors >=2.23m). AEP and NBV share the same bounded box (set_world syncs both).
# NOTE: node counts (400/1600) still UNCALIBRATED for this env — watch the first run and adjust
# world_aep_params in lib_campaign.sh if the tree saturates or starves.
WORLD=big_maze
PLANNER=aep
N=3
VOXEL_SIZE=0.1
EARLY_STOP=true
GRACE=70.0
KEEP_FOLDER=multi_series_big_maze_aep
SUMMARY=DECISION_SUMMARY_BIG_MAZE_AEP.txt
CONDITIONS=(
  "BIG_MAZE_AEP_abs|abs"
  "BIG_MAZE_AEP_marg|marg"
)
