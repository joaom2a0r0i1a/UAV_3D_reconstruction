frame_id: "world_origin"

body:
  frame_id: "fcu"

timer_main:
  rate: 10.0 # [Hz]

# School
bounded_box:
  min_x: -25.0 # [m]
  max_x: 25.0 # [m]
  min_y: -20.0 # [m]
  max_y: 15.0 # [m]
  min_z: 1.0 # [m]
  max_z: 20.0 # [m]

# Police Station
#bounded_box:
  #min_x: -15.0 # [m]
  #max_x: 15.0 # [m]
  #min_y: -20.0 # [m]
  #max_y: 15.0 # [m]
  #min_z: 1.0 # [m]
  #max_z: 20.0 # [m]

# Maze
#bounded_box:
  #min_x: -10.0 # [m]
  #max_x: 10.0 # [m]
  #min_y: -9.0 # [m]
  #max_y: 9.0 # [m]
  #min_z: 0.2 # [m]
  #max_z: 2.5 # [m]

local_planning:
  N_max: 50
  N_termination: 300
  N_yaw_samples: 15
  radius: 3.0 # [m]
  step_size: 2.0 # [m]
  min_edge_length: 0.2 # [m]
  tolerance: 1.5 # [m]
  g_zero: 5.0

global_planning:
  N_min_nodes: 300
  selection: "score"       # goal pick: "cost" (nearest), "gain" (most info), "score" (gain discounted by distance)

evaluation:
  marginal_gain: true      # true: marginal gain (frontier = path sum in global); false: absolute gain (original AEP)
  objective: expdecay      # expdecay | rate_L
  compute: "gpu"           # "gpu" (batched; absolute batches the whole tree) or "cpu" (sequential; marginal=hash)
  marginal_split: false    # for marginal+gpu: false = fused kernel, true = split kernel
  benchmark: false         # time fused/split/marginal-cpu/absolute-gpu/absolute-cpu + per-node v2-vs-cpuhash, over local+global

camera:
  frame_id: "rgbd_front_pitched/aligned_depth_to_color"
  h_fov: 1.51844 # [rad]
  width: 1080
  height: 720
  min_distance: 0.2 # [m]
  max_distance: 5 # [m]
  pitch: 10.0 # [deg] downward camera pitch (matches the front_pitched sensor)

path:
  uav_radius: 1.5 # [m] (per-world; set by lib_campaign world tables)
  waypoint_reach_distance: 0.8 # [m] advance to next waypoint within this dist (per-world; 0.8 open, 0.5 clutter to cut corner-cutting)
  collision_check_resolution: 0.1 # [m] edge/node sampling spacing (= voxel size so thin walls are not stepped over)
  optimistic_iterations: 5 # edges may plan through UNKNOWN only for the first N replans (bootstrap); then unknown=blocked (no pocket traps)
  recovery_enabled: true # master toggle for the in-planner backtrack (set FALSE for benchmark runs that idle on purpose)
  recovery_boxed_deadline: 4.0 # [s] if the tree is still tiny after this while planning -> backtrack (boxed in)
  recovery_min_tree: 10 # tree node count below which it counts as "still empty" for the boxed-in check
  recovery_timeout: 12.0 # [s] hard deadline: AEP()/NBV() backtracks after this no matter what
  lambda: 0.5 # (tunning factor)
  global_lambda: 0.05 # (tunning factor)

