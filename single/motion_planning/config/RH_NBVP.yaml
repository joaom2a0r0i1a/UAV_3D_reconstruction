frame_id: "world_origin"

body:
  frame_id: "fcu"

timer_main:
  rate: 10.0 # [Hz]

environment: school

rrt:
  N_max: 50
  N_termination: 300
  N_yaw_samples: 15
  radius: 2.0          # [m]
  step_size: 2.0       # [m]
  min_edge_length: 0.2 # [m]
  execution_horizon: 1 # executed steps per replan
  fixed_step: false    # every edge exactly step_size when true
  tolerance: 0.5       # [m]

evaluation:
  marginal_gain: true   # marginal | absolute gain
  optimize_yaw: true    # best yaw per node | sampled yaw
  compute: "gpu"        # "gpu" | "cpu"
  marginal_split: false # split | fused GPU kernel
  objective: expdecay   # expdecay | rate_L

benchmark:
  enabled: true         # benchmark on | off
  suite: "timing"       # "batch_check" | "accuracy" | "timing"
  timing_after_s: 600.0 # [s] benchmark start time
  max_replans: 10       # benchmarked replans cap

camera:
  frame_id: "rgbd_front_pitched/aligned_depth_to_color"
  h_fov: 1.51844    # [rad]
  width: 1080
  height: 720
  min_distance: 0.2 # [m]
  max_distance: 5   # [m]

path:
  uav_radius: 1.5                 # [m]
  collision_check_resolution: 0.1 # [m]
  optimistic_iterations: 5        # replans allowed through unknown space
  recovery_enabled: true          # in-planner backtrack on | off
  recovery_boxed_deadline: 4.0    # [s]
  recovery_min_tree: 10           # tree size still counted as boxed in
  recovery_timeout: 12.0          # [s]
  lambda: 0.5                     # (tuning factor)

