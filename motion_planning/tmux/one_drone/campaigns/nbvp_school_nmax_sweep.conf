# SCHOOL RH-NBVP yaw-opt N_max sweep: abs & marg x {500, 250, 50}, N=5.
# Replaces nbvp_school_nmax_sweep.sh + nbvp_day1_complete.sh + nbvp_day1_resume_n250.sh
# + nbvp_day1_extra_n250abs.sh + nbvp_day2_n500.sh. Tests node-count effect on the
# marginal-vs-absolute gap (marginal's overlap penalty only bites with a dense tree).
WORLD=school
PLANNER=nbvp
N=5
T=1850
EARLY_STOP=true
GRACE=60.0
KEEP_FOLDER=multi_series_nbvp_nmax_sweep
SUMMARY=DECISION_SUMMARY_NBVP_SCHOOL_NMAX_SWEEP.txt
CONDITIONS=(
  "NBV_abs_yaw_n500|abs|500|1000|1.0|false|true"
  "NBV_marg_yaw_n500|marg|500|1000|1.0|false|true"
  "NBV_abs_yaw_n250|abs|250|500|1.0|false|true"
  "NBV_marg_yaw_n250|marg|250|500|1.0|false|true"
  "NBV_abs_yaw_n50|abs|50|600|1.0|false|true"
  "NBV_marg_yaw_n50|marg|50|600|1.0|false|true"
)
