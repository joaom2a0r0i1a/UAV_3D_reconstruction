# MULTI-STORY AEP absolute-vs-marginal to N=10, early-stop.
# 3D compartmentalized regime (generalization + completeness tension); drone flies up the atrium.
# Run:  ./run_campaign.sh campaigns/multistory_n10.conf        (add --dry-run to preview)
WORLD=multistory
PLANNER=aep
N=10
EARLY_STOP=true
GRACE=60.0
KEEP_FOLDER=multi_series_multistory
SUMMARY=DECISION_SUMMARY_MULTISTORY_N10.txt
# "label|gain|variant"   gain=abs|marg|control
CONDITIONS=(
  "MS_abs_RRT|abs|-"
  "MS_marg_R1A|marg|R1A"
)
