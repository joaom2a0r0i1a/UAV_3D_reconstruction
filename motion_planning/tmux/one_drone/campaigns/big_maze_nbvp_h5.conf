# BIG MAZE RH-NBVP yaw-opt, EXECUTION HORIZON h=5, absolute vs marginal, 10v10. voxel 0.1 m.
# Completes the horizon sweep (h=1 = standard big_maze_nbvp; h=3 = big_maze_nbvp_h3_10v10). Identical node/step
# params to h=3 (N_max=250, N_term=1000, step 1.5, optimize_yaw, expdecay) so it is directly comparable — the
# ONLY change is execution_horizon 3 -> 5 (plan once, execute 5 steps stopping at each, then replan). marg FIRST.
# 9th CONDITIONS field = execution_horizon. Fixed+validated backtracker binary.
WORLD=big_maze
PLANNER=nbvp
N=10
VOXEL_SIZE=0.1
EARLY_STOP=true
GRACE=70.0
KEEP_FOLDER=multi_series_big_maze_nbvp_h5
SUMMARY=DECISION_SUMMARY_BIG_MAZE_NBVP_H5.txt
# NBVP: "label|gain|nmax|nterm|step|fixed|optyaw|objective|horizon"   gain=abs|marg
CONDITIONS=(
  "BIG_MAZE_NBV_H5_marg|marg|250|1000|1.5|false|true|expdecay|5"
  "BIG_MAZE_NBV_H5_abs|abs|250|1000|1.5|false|true|expdecay|5"
)
