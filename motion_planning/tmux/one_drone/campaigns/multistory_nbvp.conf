# MULTISTORY RH-NBVP yaw-opt: absolute vs marginal, 10v10. voxel 0.1 m.
# Parameters IDENTICAL to multistory AEP (world_aep_params multistory = 400 1600 1600 2.0 1.0 1.0):
#   N_max=400, N_term=1600, step 1.0  -> AEP and RH-NBVP compared on equal footing.
# optimize_yaw=true (RH-NBVP yaw optimization ON). fixed_step=false. (N_term 1600 > N_max 400 so the
# receding horizon still recedes.) Same multistory env (box/gain region/uav_radius set by set_world).
# Both conditions differ ONLY in the gain (abs vs marg).
WORLD=multistory
PLANNER=nbvp
N=10
VOXEL_SIZE=0.1
EARLY_STOP=true
GRACE=70.0
KEEP_FOLDER=multi_series_multistory_nbvp
SUMMARY=DECISION_SUMMARY_MULTISTORY_NBVP.txt
# NBVP: "label|gain|nmax|nterm|step|fixed|optyaw"   gain=abs|marg
CONDITIONS=(
  "MS_NBV_abs|abs|400|1600|1.0|false|true"
  "MS_NBV_marg|marg|400|1600|1.0|false|true"
)
