# SCHOOL — RH-NBVP (yaw-opt) FIXED-STEP, node-set 50/300, absolute vs marginal, 5v5. voxel 0.1 m.
# Companion to the existing school_NBVP_fixedstep/250_500 (step 2.0, yaw-opt) — same fixed step, smaller
# tree budget (N_max=50, N_term=300). fixed_step=true forces EVERY edge == step_size (2.0).
# GT-mode eval (school mesh). Only marginal_gain differs between the two conditions.
WORLD=school
PLANNER=nbvp
N=5
VOXEL_SIZE=0.2
T=1850
EARLY_STOP=true
GRACE=60.0
KEEP_FOLDER=multi_series_school_nbvp_fs_50_300
SUMMARY=DECISION_SUMMARY_SCHOOL_NBVP_FS_50_300.txt
# NBVP: "label|gain|nmax|nterm|step|fixed|optyaw"   gain=abs|marg
CONDITIONS=(
  "NBV_abs_yaw_n50_fs|abs|50|300|2.0|true|true"
  "NBV_marg_yaw_n50_fs|marg|50|300|2.0|true|true"
)
