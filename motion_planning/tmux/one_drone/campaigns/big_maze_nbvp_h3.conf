# BIG MAZE RH-NBVP yaw-opt, EXECUTION HORIZON h=3, absolute vs marginal, 5v5. voxel 0.1 m.
# Same node/step params as big_maze_nbvp.conf (N_max=250, N_term=1000, step 1.5, optimize_yaw, expdecay) so it
# is comparable; the only change is execution_horizon=3 (plan once, execute 3 steps stopping at each, replan).
# 9th CONDITIONS field = execution_horizon. marg first.
WORLD=big_maze
PLANNER=nbvp
N=5
VOXEL_SIZE=0.1
EARLY_STOP=true
GRACE=70.0
KEEP_FOLDER=multi_series_big_maze_nbvp_h3
SUMMARY=DECISION_SUMMARY_BIG_MAZE_NBVP_H3.txt
# NBVP: "label|gain|nmax|nterm|step|fixed|optyaw|objective|horizon"   gain=abs|marg
CONDITIONS=(
  "BIG_MAZE_NBV_H3_abs|abs|250|1000|1.5|false|true|expdecay|3"
  "BIG_MAZE_NBV_H3_marg|marg|250|1000|1.5|false|true|expdecay|3"
)
