# SCHOOL AEP 3-way (absolute / control / marginal) to N=10, early-stop.
# Replaces school_to10_fs.sh, school_campaign.sh, school_to5.sh, school_to9.sh,
# school_3h.sh, school_control_absR1A*.sh  (use -N 5/9/3 to vary target).
WORLD=school
PLANNER=aep
N=10
EARLY_STOP=true
GRACE=60.0
KEEP_FOLDER=multi_series_school_3way
SUMMARY=DECISION_SUMMARY_SCHOOL_N10.txt
# "label|gain|variant"   gain=abs|marg|control   variant=R1A|R2A|R1B|R2B
CONDITIONS=(
  "SCH_abs_RRT|abs|-"
  "SCH_ctrl_absR1A_fs|control|R1A"
  "SCH_marg_R1A|marg|R1A"
)
