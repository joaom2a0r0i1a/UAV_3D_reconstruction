frame_id: "world_origin"

body:
  frame_id: "fcu"

timer_main:
  rate: 10.0 # [Hz]

# School
bounded_box:
  min_x: -25.0 # [m]
  max_x: 25.0 # [m]
  min_y: -20.0 # [m]
  max_y: 15.0 # [m]
  min_z: 1.0 # [m]
  max_z: 20.0 # [m]

# Police Station
#bounded_box:
  #min_x: -15.0 # [m]
  #max_x: 15.0 # [m]
  #min_y: -20.0 # [m]
  #max_y: 15.0 # [m]
  #min_z: 1.0 # [m]
  #max_z: 20.0 # [m]

# Maze
#bounded_box:
  #min_x: -10.0 # [m]
  #max_x: 10.0 # [m]
  #min_y: -9.0 # [m]
  #max_y: 9.0 # [m]
  #min_z: 0.2 # [m]
  #max_z: 2.5 # [m]

rrt:
  N_max: 1000
  N_termination: 1500
  N_yaw_samples: 15
  radius: 2.0 # [m]
  step_size: 2.0 # [m]
  fixed_step: false        # false: classic RRT, edge length = min(dist, step_size); true: EVERY edge = exactly step_size
  tolerance: 0.5 # [m]
  rrt_star: false          # false = RRT (nearest parent); true = RRT* (choose-parent + rewire)

evaluation:
  marginal_gain: false     # true: marginal gain; false: absolute gain
  optimize_yaw: false      # false: keep each node's random sampled yaw (classic NBVP); true: pick argmax yaw per node (like AEP)
  compute: "cpu"           # "gpu" (batched) or "cpu" (sequential; flat-map, marginal=hash)
  marginal_split: false    # for marginal+gpu: false = fused kernel, true = split kernel

benchmark:
  enabled: false           # time all gain variants (G_all / single-parent / absolute, gpu & cpu) per replan
  timing_after_s: 600.0    # [s] only benchmark once sim-time >= this (skips early collision-heavy replans)
  x2_max: 10               # cap on benchmarked replans per run (heavy at large N)

camera:
  frame_id: "rgbd_front_pitched/aligned_depth_to_color"
  h_fov: 1.51844 # [rad]
  width: 1080
  height: 720
  min_distance: 0.2 # [m]
  max_distance: 5 # [m]

path:
  uav_radius: 1.5 # [m]
  lambda: 0.5 # (tunning factor)

